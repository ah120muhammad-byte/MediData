workflows:
  ios-test:
    name: MediData iOS Test
    max_build_duration: 120

    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.example.medidata26

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Generate native splash branding
        script: |
          bash tool/generate_splash_branding.sh
          dart run flutter_native_splash:create

      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles

      - name: Flutter analyze
        script: |
          flutter analyze

      - name: Build iOS IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
