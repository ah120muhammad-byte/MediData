flutter_native_splash:
  # Light / dark startup backgrounds matching the app theme.
  color: "#F3F6FA"
  color_dark: "#0A111D"

  # Main splash logo.
  image: images/icon-1.png
  image_dark: images/icon-1.png

  # Branding is generated by tool/generate_splash_branding.sh.
  branding: images/splash/medidata_branding.png
  branding_dark: images/splash/medidata_branding.png
  branding_mode: bottom
  branding_bottom_padding: 72
  branding_bottom_padding_android: 72
  branding_bottom_padding_ios: 72

  android: true
  ios: true
  web: true

  android_12:
    color: "#F3F6FA"
    color_dark: "#0A111D"

    # Android 12+ center icon.
    image: images/splash/splash_logo.png
    image_dark: images/splash/splash_logo.png

    # Android 12+ branding image must be 800x320.
    branding: images/splash/medidata_branding.png
    branding_dark: images/splash/medidata_branding.png
