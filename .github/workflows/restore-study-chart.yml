name: Restore Study Activity line chart

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Restore Study Activity line chart') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch profile screen
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/screens/main/profile_screen.dart')
          text = path.read_text(encoding='utf-8')

          import_line = "import 'package:fl_chart/fl_chart.dart';\n"
          if import_line not in text:
              text = import_line + text

          old_call = """child: _StudyActivityList(\n                        activity: data.analytics.dailyActivity,\n                      ),"""
          new_call = """child: _StudyActivityChart(\n                        activity: data.analytics.dailyActivity,\n                      ),"""
          if old_call in text:
              text = text.replace(old_call, new_call, 1)

          start_marker = 'class _StudyActivityList extends StatelessWidget {'
          end_marker = 'class _ExamPerformance extends StatelessWidget {'
          start = text.find(start_marker)
          end = text.find(end_marker, start + 1)
          if start == -1 or end == -1:
              raise SystemExit('Could not locate Study Activity block')

          chart = r'''class _StudyActivityChart extends StatelessWidget {
            final List<DailyStudyActivity> activity;

            const _StudyActivityChart({required this.activity});

            @override
            Widget build(BuildContext context) {
              final theme = Theme.of(context);

              if (activity.isEmpty) {
                return const _ChartEmptyState(
                  icon: Icons.insights_outlined,
                  text: 'Study activity will appear here once you start studying.',
                );
              }

              final spots = List.generate(
                activity.length,
                (index) => FlSpot(
                  index.toDouble(),
                  activity[index].studyMinutes.toDouble(),
                ),
              );

              final maxValue = activity.fold<double>(
                0,
                (current, item) => current > item.studyMinutes
                    ? current
                    : item.studyMinutes.toDouble(),
              );

              final maxY = maxValue <= 5
                  ? 10.0
                  : ((maxValue * 1.2) / 5).ceil() * 5.0;

              return SizedBox(
                height: 220,
                child: LineChart(
                  LineChartData(
                    minY: 0,
                    maxY: maxY,
                    minX: 0,
                    maxX: (activity.length - 1).toDouble(),
                    gridData: FlGridData(
                      show: true,
                      drawVerticalLine: false,
                      horizontalInterval: maxY / 5,
                    ),
                    borderData: FlBorderData(show: false),
                    titlesData: FlTitlesData(
                      leftTitles: AxisTitles(
                        sideTitles: SideTitles(
                          showTitles: true,
                          reservedSize: 32,
                          interval: maxY / 5,
                          getTitlesWidget: (value, meta) => Text(
                            value.toInt().toString(),
                            style: const TextStyle(fontSize: 9),
                          ),
                        ),
                      ),
                      rightTitles: const AxisTitles(
                        sideTitles: SideTitles(showTitles: false),
                      ),
                      topTitles: const AxisTitles(
                        sideTitles: SideTitles(showTitles: false),
                      ),
                      bottomTitles: AxisTitles(
                        sideTitles: SideTitles(
                          showTitles: true,
                          interval: activity.length > 7 ? 2 : 1,
                          reservedSize: 28,
                          getTitlesWidget: (value, meta) {
                            final index = value.round();
                            if (index < 0 || index >= activity.length) {
                              return const SizedBox.shrink();
                            }
                            final day = activity[index].day;
                            return Padding(
                              padding: const EdgeInsets.only(top: 6),
                              child: Text(
                                '${day.day}/${day.month}',
                                style: const TextStyle(fontSize: 9),
                              ),
                            );
                          },
                        ),
                      ),
                    ),
                    lineBarsData: [
                      LineChartBarData(
                        spots: spots,
                        isCurved: true,
                        barWidth: 3,
                        color: theme.colorScheme.primary,
                        dotData: const FlDotData(show: false),
                        belowBarData: BarAreaData(
                          show: true,
                          gradient: LinearGradient(
                            begin: Alignment.topCenter,
                            end: Alignment.bottomCenter,
                            colors: [
                              theme.colorScheme.primary.withValues(alpha: .14),
                              theme.colorScheme.primary.withValues(alpha: .01),
                            ],
                          ),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          '''

          text = text[:start] + chart + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/main/profile_screen.dart .github/workflows/restore-study-chart.yml
          git rm .github/workflows/restore-study-chart.yml
          git commit -m "Restore Study Activity line chart"
          git push
