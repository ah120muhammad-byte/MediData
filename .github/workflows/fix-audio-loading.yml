name: Fix audio player loading flow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Fix audio player loading flow') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch audio player
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/screens/main/lecture_audio_player_screen.dart')
          text = path.read_text(encoding='utf-8')

          old_init = """  @override\n  void initState() {\n    super.initState();\n    _initializePlayer();\n  }"""
          new_init = """  @override\n  void initState() {\n    super.initState();\n    WidgetsBinding.instance.addPostFrameCallback((_) {\n      if (!mounted) return;\n      _initializePlayer();\n    });\n  }"""
          if old_init not in text:
              raise SystemExit('initState block not found')
          text = text.replace(old_init, new_init, 1)

          old_toggle = """  Future<void> _togglePlayback() async {\n    if (_audio.isPlaying) {\n      await _audio.pause();\n    } else {\n      await _audio.play();\n    }\n    if (mounted) setState(() {});\n  }"""
          new_toggle = """  Future<void> _togglePlayback() async {\n    if (_loading) return;\n    if (_audio.isPlaying) {\n      await _audio.pause();\n    } else {\n      await _audio.play();\n    }\n    if (mounted) setState(() {});\n  }"""
          if old_toggle not in text:
              raise SystemExit('_togglePlayback block not found')
          text = text.replace(old_toggle, new_toggle, 1)

          old_body = """      body: _loading\n          ? const Center(child: CircularProgressIndicator())\n          : _error != null\n              ? _buildError(context)\n              : _buildPlayer(context, scheme),"""
          new_body = """      body: _error != null\n          ? _buildError(context)\n          : Stack(\n              children: [\n                _buildPlayer(context, scheme),\n                if (_loading)\n                  Positioned.fill(\n                    child: ColoredBox(\n                      color: Colors.black12,\n                      child: Center(\n                        child: Card(\n                          elevation: 2,\n                          child: Padding(\n                            padding: const EdgeInsets.symmetric(\n                              horizontal: 18,\n                              vertical: 14,\n                            ),\n                            child: Row(\n                              mainAxisSize: MainAxisSize.min,\n                              children: [\n                                const SizedBox(\n                                  width: 20,\n                                  height: 20,\n                                  child: CircularProgressIndicator(strokeWidth: 2.4),\n                                ),\n                                const SizedBox(width: 12),\n                                Text(\n                                  'Loading audio…',\n                                  style: Theme.of(context).textTheme.bodyMedium,\n                                ),\n                              ],\n                            ),\n                          ),\n                        ),\n                      ),\n                    ),\n                  ),\n              ],\n            ),"""
          if old_body not in text:
              raise SystemExit('body block not found')
          text = text.replace(old_body, new_body, 1)

          old_control = """                onPressed: _togglePlayback,\n                style: FilledButton.styleFrom(shape: const CircleBorder(), padding: EdgeInsets.zero),"""
          new_control = """                onPressed: _loading ? null : _togglePlayback,\n                style: FilledButton.styleFrom(shape: const CircleBorder(), padding: EdgeInsets.zero),"""
          if old_control not in text:
              raise SystemExit('play button block not found')
          text = text.replace(old_control, new_control, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/main/lecture_audio_player_screen.dart .github/workflows/fix-audio-loading.yml
          git rm .github/workflows/fix-audio-loading.yml
          git commit -m "Fix audio player loading flow"
          git push
