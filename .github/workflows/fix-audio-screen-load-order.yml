name: Fix audio screen load order

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Fix audio screen load order') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch audio screen
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/screens/main/lecture_audio_player_screen.dart')
          text = path.read_text(encoding='utf-8')

          old = '''  @override
  void initState() {
    super.initState();
    _initializePlayer();
  }'''

          new = '''  @override
  void initState() {
    super.initState();

    // Paint the audio screen first. Only after the first frame is visible do
    // we resolve the source and start playback.
    WidgetsBinding.instance.addPostFrameCallback((_) {
      if (!mounted) return;
      _initializePlayer();
    });
  }'''

          if old not in text:
              raise SystemExit('Expected initState block was not found')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/main/lecture_audio_player_screen.dart
          git rm .github/workflows/fix-audio-screen-load-order.yml
          git commit -m "Fix audio screen load order"
          git push
